<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>المصحف الكريم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ══════════════════════════════════════════════════
   VARIABLES
══════════════════════════════════════════════════ */
:root {
  --bg:#07070f;
  --bg2:#0d0d1f;
  --card:#0f1020;
  --card2:#131325;
  --border:#1e2040;
  --text:#d4e0ff;
  --text-dim:#5a6280;
  --neon:#00ff99;
  --neon2:#00ccff;
  --gold:#ffd060;
  --gold2:#ffaa00;
  --green:#00b36b;
  --green-dark:#007844;
  --chip-bg:#0f1020;
  --radius:14px;
  --shadow:0 8px 32px rgba(0,255,153,.12);
  --header-bg:rgba(7,7,15,.96);
  --bar-bg:rgba(7,7,15,.97);
  --bar-border:rgba(30,32,64,.7);
  --overlay-bg:rgba(0,0,8,.82);
  --modal-bg:#0a0a1a;
  --surah-box:#0a1a14;
  --neon-glow:drop-shadow(0 0 8px #00ff99) drop-shadow(0 0 16px #00ff99);
  --gold-glow:drop-shadow(0 0 8px #ffd060) drop-shadow(0 0 16px #ffaa00);
  --verse-color:#e8fff2;
}
[data-theme="light"] {
  --bg:#f8f4ec;
  --bg2:#ede7d8;
  --card:#fff;
  --card2:#f5f0e6;
  --border:#ddd0b0;
  --text:#1a1a10;
  --text-dim:#7a7060;
  --neon:#007a40;
  --neon2:#005f80;
  --gold:#c97a00;
  --gold2:#a05000;
  --green:#006030;
  --green-dark:#004020;
  --chip-bg:#fff;
  --shadow:0 8px 32px rgba(0,100,50,.1);
  --header-bg:rgba(248,244,236,.97);
  --bar-bg:rgba(255,255,255,.97);
  --bar-border:rgba(180,160,120,.4);
  --overlay-bg:rgba(0,0,0,.55);
  --modal-bg:#f8f4ec;
  --surah-box:#e8f5ee;
  --neon-glow:drop-shadow(0 0 4px #007a40);
  --gold-glow:drop-shadow(0 0 4px #c97a00);
  --verse-color:#0a1a0a;
}

/* ══════════════════════════════════════════════════
   RESET
══════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'Cairo',sans-serif;direction:rtl;overflow-x:hidden;
  transition:background .4s,color .4s}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ══════════════════════════════════════════════════
   ── SPLASH ──
══════════════════════════════════════════════════ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(175deg,#02010c 0%,#050318 35%,#0a0620 65%,#120830 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  overflow:hidden;
}
#splash.fade-out{animation:splashOut 1s ease-in forwards}
@keyframes splashOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.03);pointer-events:none}}

/* Stars */
.star{position:absolute;border-radius:50%;background:#fff;
  animation:twinkle var(--dur,2s) var(--delay,0s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.15;transform:scale(.7)}100%{opacity:1;transform:scale(1.3)}}

/* Shooting stars */
.shoot{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#fff;opacity:0;
  animation:shoot var(--sd,3s) var(--ss,0s) ease-in infinite;
}
@keyframes shoot{
  0%{opacity:0;transform:translate(0,0) scale(1)}
  5%{opacity:1}
  15%{opacity:0;transform:translate(-120px,60px) scale(0)}
  100%{opacity:0}
}

/* Moon */
.splash-moon{position:absolute;top:7%;right:9%;width:72px;height:72px;
  opacity:0;animation:moonRise 1.2s .3s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes moonRise{
  0%{opacity:0;transform:translateY(20px)}
  100%{opacity:1;transform:translateY(0)}
}
.moon-halo{
  position:absolute;top:4%;right:5%;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,80,.08) 0%,transparent 70%);
  opacity:0;animation:fadeIn 1s .6s ease forwards;
}
@keyframes fadeIn{to{opacity:1}}

/* Bismillah */
.splash-bismillah{
  position:absolute;top:9%;left:50%;transform:translateX(-50%);
  font-family:'Amiri Quran',serif;font-size:22px;color:var(--gold);
  text-shadow:0 0 14px #ffd060,0 0 28px #ffaa00,0 0 50px rgba(255,170,0,.4);
  white-space:nowrap;opacity:0;animation:textAppear 1s 1s ease forwards;
  text-align:center;letter-spacing:.5px;
}
.splash-title{
  position:absolute;top:calc(9% + 38px);left:50%;transform:translateX(-50%);
  font-size:14px;font-weight:600;color:rgba(180,215,200,.8);
  letter-spacing:3px;white-space:nowrap;text-transform:uppercase;
  opacity:0;animation:textAppear 1s 1.5s ease forwards;
}
@keyframes textAppear{
  0%{opacity:0;transform:translateX(-50%) translateY(8px)}
  100%{opacity:1;transform:translateX(-50%) translateY(0)}
}

/* ── MOSQUE SCENE ── */
.mosque-scene{
  width:100%;max-width:480px;position:relative;
  opacity:0;animation:sceneIn 1.2s 1s ease forwards;
}
@keyframes sceneIn{to{opacity:1}}

/* ── SHEIKH – Realistic walking figure ── */
.sheikh-wrap{
  position:absolute;
  bottom:74px;
  right:-90px;
  z-index:20;
  animation:sheikhWalk 3.2s 1.8s cubic-bezier(.38,0,.55,1) forwards;
  transform-origin:bottom center;
}
@keyframes sheikhWalk{
  0%  {right:-90px;transform:scaleX(1) scale(1);opacity:1}
  55% {right:39%;transform:scaleX(1) scale(1);opacity:1}
  70% {right:39%;transform:scaleX(1) scale(.85);opacity:1}
  88% {right:40%;transform:scaleX(1) scale(.55);opacity:.8}
  100%{right:40%;transform:scaleX(1) scale(.15);opacity:0}
}

/* Sheikh shadow on ground */
.sheikh-shadow{
  position:absolute;bottom:-4px;left:50%;
  transform:translateX(-50%);
  width:36px;height:8px;border-radius:50%;
  background:rgba(0,0,0,.5);
  filter:blur(3px);
  animation:shadowPulse 3.2s 1.8s cubic-bezier(.38,0,.55,1) forwards;
}
@keyframes shadowPulse{
  0%  {width:36px;opacity:.5}
  55% {width:36px;opacity:.5}
  100%{width:8px;opacity:0}
}

/* Walking legs keyframe via SMIL is in SVG.
   We add a CSS body-bob for realism */
.sheikh-body{
  animation:bodyBob .55s ease-in-out infinite alternate;
}
@keyframes bodyBob{
  0%{transform:translateY(0)}
  100%{transform:translateY(-2px)}
}

/* Door glow on arrival */
.door-glow{
  position:absolute;
  bottom:74px;
  right:0;left:0;
  display:flex;justify-content:center;
  opacity:0;
  animation:doorFlare .8s 4.7s ease forwards;
}
@keyframes doorFlare{
  0%{opacity:0;filter:blur(10px)}
  50%{opacity:1;filter:blur(2px)}
  100%{opacity:.85;filter:blur(0)}
}

/* Light particles from mosque door */
.door-particle{
  position:absolute;border-radius:50%;pointer-events:none;
  animation:doorPart var(--dp,2s) var(--dps,5s) ease-out infinite;
  opacity:0;
}
@keyframes doorPart{
  0%{opacity:.9;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx,20px),var(--dy,-40px)) scale(0)}
}

/* Loading dots */
.splash-dots{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  display:flex;gap:7px;
}
.splash-dot{width:6px;height:6px;border-radius:50%;
  background:var(--neon);opacity:.2;
  animation:dotPulse 1.4s var(--dd,0s) ease-in-out infinite alternate}
@keyframes dotPulse{to{opacity:1;transform:scale(1.5)}}

/* ══════════════════════════════════════════════════
   ── MAIN APP ──
══════════════════════════════════════════════════ */
#mainApp{max-width:480px;margin:0 auto;padding-bottom:130px;
  opacity:0;transition:opacity .7s ease}
#mainApp.visible{opacity:1}

/* Background canvas */
#particleCanvas{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35}

/* ── HEADER ── */
.header{
  padding:16px 16px 12px;
  background:var(--header-bg);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid rgba(255,255,255,.04);
  transition:background .4s;
}
.header-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.header-left{display:flex;align-items:center;gap:10px}
.header-left h1{
  font-size:19px;font-weight:900;
  color:#fff;
  letter-spacing:-.3px;
  text-shadow:0 0 20px rgba(0,255,153,.2);
}
[data-theme="light"] .header-left h1{color:#0a1a08;text-shadow:none}

.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--neon);
  box-shadow:0 0 8px var(--neon);
  display:inline-block;margin-right:2px;
  animation:livePulse 2s ease-in-out infinite;
}
@keyframes livePulse{
  0%,100%{box-shadow:0 0 4px var(--neon);transform:scale(1)}
  50%{box-shadow:0 0 12px var(--neon),0 0 20px rgba(0,255,153,.3);transform:scale(1.2)}
}

.header-sub{
  font-size:11px;color:var(--neon);font-weight:700;
  letter-spacing:.8px;margin-bottom:4px;text-transform:uppercase;
  text-shadow:0 0 10px var(--neon);
}
.header-desc{font-size:11.5px;color:var(--text-dim);line-height:1.7;margin-bottom:12px}

/* Theme toggle */
.theme-btn{
  background:transparent;border:1.5px solid var(--border);
  border-radius:20px;padding:6px 12px;
  cursor:pointer;display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--text-dim);
  transition:all .2s;user-select:none;font-family:'Cairo',sans-serif;
}
.theme-btn:active{transform:scale(.94);border-color:var(--neon)}

/* ── SEARCH ── */
.search-wrap{
  display:flex;border-radius:12px;overflow:hidden;
  border:1.5px solid var(--border);margin-bottom:10px;
  transition:border-color .2s,box-shadow .2s;background:var(--card);
}
.search-wrap:focus-within{
  border-color:var(--neon);
  box-shadow:0 0 0 3px rgba(0,255,153,.1);
}
.search-wrap input{
  flex:1;background:transparent;border:none;outline:none;
  padding:10px 14px;color:var(--text);
  font-family:'Cairo',sans-serif;font-size:13px;direction:rtl;
}
.search-wrap input::placeholder{color:var(--text-dim)}
.search-btn{
  background:var(--green-dark);border:none;padding:0 16px;
  cursor:pointer;display:flex;align-items:center;
  transition:background .2s;
}
.search-btn:active{filter:brightness(1.3)}

/* ── CHIPS ── */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;background:var(--card);border:1.5px solid var(--border);
  color:var(--text-dim);border-radius:20px;padding:5px 14px;
  font-size:12px;font-family:'Cairo',sans-serif;cursor:pointer;
  transition:all .2s;white-space:nowrap;font-weight:600;
}
.chip:active,.chip.active{
  background:var(--green-dark);border-color:var(--neon);color:#fff;
  box-shadow:0 0 10px rgba(0,255,153,.25);
}

/* ── NEON SEPARATOR ── */
.neon-line{
  height:1px;margin:0;
  background:linear-gradient(90deg,transparent 0%,var(--neon) 30%,var(--gold) 50%,var(--neon) 70%,transparent 100%);
  opacity:.2;
}

/* ── PAGE CARD ── */
.page-card{
  margin:12px 12px 0;background:var(--card);
  border-radius:18px;overflow:hidden;
  border:1px solid var(--border);
  transition:border-color .3s,box-shadow .3s;
  position:relative;z-index:1;
}
.page-card::before{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:18px;
  background:radial-gradient(ellipse at 0% 0%,rgba(0,255,153,.04),transparent 55%);
}
.card-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 8px;
}
.font-ctrl{
  display:flex;align-items:center;gap:6px;
  background:var(--card2);border:1.5px solid var(--border);
  border-radius:10px;padding:6px 12px;cursor:pointer;
  color:var(--text-dim);font-size:12px;user-select:none;
  transition:all .15s;font-family:'Cairo',sans-serif;font-weight:600;
}
.font-ctrl:active{background:var(--border);transform:scale(.96)}
.page-meta{text-align:left}
.page-num{
  font-size:14px;font-weight:900;color:var(--neon);
  text-shadow:0 0 10px var(--neon);letter-spacing:-.3px;
}
.page-surah{font-size:11.5px;color:var(--text-dim);margin-top:2px;font-weight:500}

/* ── TABS ── */
.tabs{
  display:flex;margin:0 16px 12px;
  border-radius:10px;overflow:hidden;
  border:1.5px solid var(--border);
  background:var(--card2);
}
.tab-btn{
  flex:1;padding:9px 0;text-align:center;
  font-size:13px;font-family:'Cairo',sans-serif;font-weight:700;
  cursor:pointer;border:none;background:transparent;
  color:var(--text-dim);transition:all .25s;
  position:relative;
}
.tab-btn.active{
  background:var(--green-dark);color:#fff;
  box-shadow:inset 0 0 14px rgba(0,255,153,.15);
}

/* ── SURAH BOX ── */
.surah-box{
  margin:0 16px 12px;
  border:1px solid var(--neon);
  border-radius:12px;padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surah-box);
  box-shadow:0 0 20px rgba(0,255,153,.08),inset 0 0 30px rgba(0,255,153,.03);
  position:relative;overflow:hidden;
}
.surah-box::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--neon),var(--gold));
}
.surah-box-name{
  font-size:22px;font-weight:700;color:var(--neon);
  font-family:'Amiri Quran',serif;
  text-shadow:0 0 12px rgba(0,255,153,.4);
}
.surah-box-info{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.surah-box-loc{font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:4px}
.surah-box-num{font-size:12px;color:var(--gold);font-weight:700}

/* ── VERSES ── */
.verse-section{padding:4px 16px 14px}
.verse-paragraph{
  font-family:'Amiri Quran',serif;font-size:22px;
  line-height:2.8;text-align:justify;
  color:var(--verse-color);direction:rtl;
}
.ayah-num{
  display:inline-flex;align-items:center;justify-content:center;
  width:27px;height:27px;border-radius:50%;
  border:1.5px solid var(--gold);
  color:var(--gold);font-size:10px;
  font-family:'Cairo',sans-serif;vertical-align:middle;
  margin:0 4px;flex-shrink:0;
  box-shadow:0 0 8px rgba(255,208,96,.2);
  text-shadow:0 0 6px var(--gold);
  transition:all .2s;
}
.ayah-num.playing-ayah{
  background:var(--gold);color:#000;
  box-shadow:0 0 16px rgba(255,208,96,.6);
  animation:ayahPulse 1s ease-in-out infinite alternate;
}
@keyframes ayahPulse{
  0%{box-shadow:0 0 8px rgba(255,208,96,.4)}
  100%{box-shadow:0 0 20px rgba(255,208,96,.8)}
}
.tafsir-text{font-family:'Cairo',sans-serif;font-size:14px;line-height:2;color:var(--text)}
.tafsir-ayah{margin-bottom:14px;border-right:3px solid var(--neon);padding-right:12px;
  transition:border-color .2s}
.tafsir-num{font-size:11px;color:var(--neon);margin-bottom:5px;font-weight:700;letter-spacing:.3px}

/* Basmala */
.basmala{
  text-align:center;font-family:'Amiri Quran',serif;font-size:25px;
  color:var(--gold);padding:12px 16px;
  text-shadow:0 0 12px rgba(255,208,96,.5);
  letter-spacing:.5px;
}

/* ── SURAH LIST MODAL ── */
.surah-all-chip{flex-shrink:0;background:linear-gradient(135deg,#00ff9920,#00ffd510);border-color:var(--neon)}
.surah-modal{position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);max-width:480px;margin:0 auto}
.surah-modal-content{width:100%;max-height:82vh;height:82vh;background:var(--card);border:1.5px solid var(--border);border-bottom-left-radius:24px;border-bottom-right-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.surah-modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.surah-modal-title{font-family:'Cairo',sans-serif;font-size:18px;font-weight:800;color:var(--text)}
.surah-modal-close{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#surahSearchInput{margin:8px 16px 12px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--card2);color:var(--text);font-family:'Cairo',sans-serif;font-size:14px;width:calc(100% - 32px);box-sizing:border-box}
#surahSearchInput:focus{outline:none;border-color:var(--neon)}
.surah-grid{flex:1;overflow-y:auto;padding:0 16px 22px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px;scrollbar-width:thin}
.surah-grid::-webkit-scrollbar{width:5px}
.surah-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
.surah-item{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--surah-box);cursor:pointer;transition:all .15s}
.surah-item:active{border-color:var(--neon);transform:scale(.97)}
.surah-item-num{font-size:11px;color:var(--gold);font-weight:800;min-width:24px;text-align:center}
.surah-item-name{font-family:'Cairo',sans-serif;font-size:13.5px;font-weight:700;color:var(--text);flex:1}
.surah-item-meta{font-size:10px;color:var(--text-dim);white-space:nowrap}
.surah-item.hidden{display:none}
/* ── SEPARATOR ── */
.surah-separator{
  margin:16px 16px 10px;border:none;height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
}

/* ── PAGE NAV ── */
.page-nav{margin:10px 12px 0;display:flex;gap:8px}
.nav-btn{
  flex:1;padding:13px 0;text-align:center;
  background:var(--card);border:1.5px solid var(--border);
  border-radius:12px;color:var(--text);
  font-size:13px;font-family:'Cairo',sans-serif;font-weight:700;
  cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.nav-btn:not(:disabled):active{
  background:var(--card2);border-color:var(--neon);
  box-shadow:0 0 12px rgba(0,255,153,.15);
  transform:scale(.97);
}
.nav-btn:disabled{opacity:.2;cursor:default}

/* ── BOTTOM BAR ── */
.bottom-bar{
  position:fixed;bottom:0;right:0;left:0;max-width:480px;margin:0 auto;
  background:var(--bar-bg);backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--bar-border);
  display:flex;z-index:100;
  transition:background .4s;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.bar-btn{
  flex:1;padding:13px 0 10px;text-align:center;
  font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;
  color:var(--text-dim);cursor:pointer;border:none;background:none;
  transition:color .2s;display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;overflow:hidden;
}
.bar-btn::after{
  content:'';position:absolute;bottom:0;left:30%;right:30%;height:2px;
  background:var(--neon);border-radius:2px 2px 0 0;
  transform:scaleX(0);transition:transform .3s ease;
}
.bar-btn.playing::after,.bar-btn.active-bar::after{transform:scaleX(1)}
.bar-btn:active,.bar-btn.playing,.bar-btn.active-bar{color:var(--neon)}
.bar-btn svg{transition:filter .25s,transform .2s}
.bar-btn.playing svg,.bar-btn.active-bar svg{filter:var(--neon-glow)}
.bar-btn:active svg{transform:scale(.88)}
.bar-divider{width:1px;background:var(--bar-border);margin:10px 0}

/* ── AUDIO VISUALIZER ── */
.audio-waves{display:flex;align-items:flex-end;gap:2px;height:14px}
.wave-bar{
  width:3px;border-radius:2px;background:var(--neon);
  animation:waveAnim 1s var(--wd,0s) ease-in-out infinite alternate;
  box-shadow:0 0 4px var(--neon);
}
@keyframes waveAnim{0%{height:3px}100%{height:13px}}

/* ── RECITER MODAL ── */
#reciterModal{
  position:fixed;inset:0;background:var(--overlay-bg);
  z-index:500;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#reciterModal.show{opacity:1;pointer-events:all}
.reciter-panel{
  width:100%;max-width:480px;margin:0 auto;
  background:var(--modal-bg);border-radius:22px 22px 0 0;
  padding:20px 16px calc(env(safe-area-inset-bottom)+24px);
  max-height:72vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.4,1);
  border-top:2px solid var(--neon);
  box-shadow:0 -12px 50px rgba(0,255,153,.12);
}
#reciterModal.show .reciter-panel{transform:translateY(0)}
.reciter-title{
  font-size:16px;font-weight:900;color:var(--neon);
  margin-bottom:16px;text-align:center;
  text-shadow:0 0 10px var(--neon);
  letter-spacing:-.2px;
}
.reciter-list{display:flex;flex-direction:column;gap:8px}
.reciter-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;background:var(--card);
  border:1.5px solid var(--border);border-radius:12px;
  cursor:pointer;transition:all .2s;
}
.reciter-item:active{transform:scale(.98)}
.reciter-item.selected{
  border-color:var(--neon);background:var(--surah-box);
  box-shadow:0 0 14px rgba(0,255,153,.12);
}
.reciter-name{font-size:14px;font-weight:700;color:var(--text)}
.reciter-en{font-size:11px;color:var(--text-dim);margin-top:2px;font-weight:400}
.reciter-check{opacity:0;transition:opacity .2s;flex-shrink:0}
.reciter-item.selected .reciter-check{opacity:1;filter:var(--neon-glow)}

/* ── LOADER ── */
#loader{
  position:fixed;inset:0;background:rgba(7,7,15,.75);
  display:flex;align-items:center;justify-content:center;
  z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;
  backdrop-filter:blur(4px);
}
#loader.show{opacity:1;pointer-events:all}
.spinner-ring{
  width:50px;height:50px;
  border:3px solid var(--border);
  border-top-color:var(--neon);
  border-right-color:var(--gold);
  border-radius:50%;
  animation:spin .75s linear infinite;
  filter:drop-shadow(0 0 8px var(--neon));
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── OVERVIEW MODAL ── */
#overview{
  position:fixed;inset:0;background:var(--overlay-bg);
  z-index:400;display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
#overview.show{opacity:1;pointer-events:all}
.overview-panel{
  width:100%;max-width:480px;margin:0 auto;
  background:var(--modal-bg);border-radius:22px 22px 0 0;
  padding:20px 16px 30px;max-height:65vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.4,1);
  border-top:2px solid var(--gold);
  box-shadow:0 -12px 50px rgba(255,208,96,.1);
}
#overview.show .overview-panel{transform:translateY(0)}
.overview-title{
  font-size:16px;font-weight:900;color:var(--gold);
  margin-bottom:16px;text-align:center;
  text-shadow:0 0 10px var(--gold);
  letter-spacing:-.2px;
}
.overview-info{display:flex;flex-direction:column;gap:8px}
.ov-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;padding:12px 14px;
  background:var(--card);border-radius:10px;
  border:1px solid var(--border);
}
.ov-label{color:var(--text-dim);font-weight:600}
.ov-val{color:var(--text);font-weight:700}
.ov-close{
  display:block;margin:18px auto 0;background:var(--green-dark);
  color:#fff;border:none;border-radius:12px;
  padding:12px 50px;font-family:'Cairo',sans-serif;
  font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 0 16px rgba(0,255,153,.2);
  transition:all .15s;
}
.ov-close:active{transform:scale(.96)}

/* ── FONT SIZES ── */
.fs-sm .verse-paragraph{font-size:19px}
.fs-md .verse-paragraph{font-size:22px}
.fs-lg .verse-paragraph{font-size:26px}

/* ── MSG BOX ── */
.msg-box{padding:40px 16px;text-align:center;color:var(--text-dim);font-size:14px;line-height:2}

/* Ripple effect */
.ripple{
  position:absolute;border-radius:50%;
  background:rgba(0,255,153,.25);
  transform:scale(0);animation:rippleOut .5s ease-out forwards;
  pointer-events:none;
}
@keyframes rippleOut{to{transform:scale(4);opacity:0}}

/* Toast notification */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--card2);border:1.5px solid var(--neon);
  color:var(--text);padding:10px 20px;border-radius:20px;
  font-size:13px;font-weight:600;z-index:9000;
  opacity:0;transition:all .3s cubic-bezier(.2,.8,.4,1);
  box-shadow:0 8px 30px rgba(0,255,153,.2);
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════
     SPLASH
══════════════════════════════════════════════ -->
<div id="splash">
  <div id="starsLayer"></div>
  <div class="moon-halo"></div>

  <!-- Moon -->
  <div class="splash-moon">
    <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="moonGlow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>

        <radialGradient id="moonGrad" cx="38%" cy="35%">
          <stop offset="0%" stop-color="#fffae8"/>

      </defs>

      <circle cx="44" cy="28" r="1.5" fill="rgba(180,130,20,.1)"/>
    </svg>
  </div>

  <div class="splash-bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>

  <!-- Mosque Scene -->
  <div class="mosque-scene" id="mosqueScene">

    <!-- Door glow -->
    <div class="door-glow" id="doorGlow">
      <svg width="120" height="80" viewBox="0 0 120 80" fill="none">
        <defs>
          <radialGradient id="doorLG" cx="50%" cy="100%">
            <stop offset="0%" stop-color="#ffd060" stop-opacity=".95"/>

            <stop offset="70%" stop-color="#ff6600" stop-opacity=".2"/>
            <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse cx="60" cy="76" rx="80" ry="55" fill="url(#doorLG)"/>
      </svg>
    </div>

    <!-- ── SHEIKH – Fully animated realistic figure ── -->
    <div class="sheikh-wrap" id="sheikhFig">
      <div class="sheikh-body">
        <svg width="46" height="96" viewBox="0 0 46 96" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="sheikhShadowF">
              <feGaussianBlur stdDeviation="2" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <linearGradient id="thobeGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f5f5f5"/>
              <stop offset="50%" stop-color="#efefef"/>
              <stop offset="100%" stop-color="#e0e0e0"/>
            </linearGradient>
            <linearGradient id="thobeShadow" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(0,0,0,.12)"/>
              <stop offset="100%" stop-color="rgba(0,0,0,.0)"/>
            </linearGradient>
            <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#d4a07a"/>
              <stop offset="100%" stop-color="#c49070"/>
            </linearGradient>
          </defs>

          <!-- Ground shadow -->
          <ellipse cx="23" cy="94" rx="16" ry="3.5" fill="rgba(0,0,0,.35)" opacity=".7">
            <animate attributeName="rx" values="16;14;16" dur=".55s" repeatCount="indefinite"/>
          </ellipse>

          <!-- ── LEGS – alternating walk cycle ── -->
          <!-- Left leg (thobe fold) -->
          <g id="legL">
            <animateTransform attributeName="transform" type="rotate"
              values="10,15,68;-12,15,68;10,15,68" dur=".55s" repeatCount="indefinite"
              calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
            <path d="M13,68 Q12,80 10,93 Q14,94 16,93 Q18,80 17,68 Z" fill="#e0e0e0"/>
            <!-- Shoe -->
            <ellipse cx="12" cy="93" rx="6" ry="2.5" fill="#3a3a3a">
              <animate attributeName="cx" values="12;10;12" dur=".55s" repeatCount="indefinite"/>
            </ellipse>
          </g>
          <!-- Right leg -->
          <g id="legR">
            <animateTransform attributeName="transform" type="rotate"
              values="-10,30,68;12,30,68;-10,30,68" dur=".55s" repeatCount="indefinite"
              calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
            <path d="M26,68 Q27,80 29,93 Q33,94 35,93 Q33,80 30,68 Z" fill="#d8d8d8"/>

          <!-- ── THOBE / Body ── -->
          <path d="M9,22 Q7,45 7,68 L36,68 Q36,45 34,22 Z" fill="url(#thobeGrad)"/>

          <path d="M34,22 Q33,45 32,68" fill="none" stroke="rgba(0,0,0,.06)" stroke-width="1.5"/>

          <!-- ── LEFT ARM – swinging ── -->
          <g>
            <animateTransform attributeName="transform" type="rotate"

              calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
            <path d="M8,24 Q5,36 4,46" stroke="#eeeeee" stroke-width="8" stroke-linecap="round" fill="none"/>

          <!-- ── RIGHT ARM – swinging opposite ── -->
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="-18,36,24;18,36,24;-18,36,24" dur=".55s" repeatCount="indefinite"
              calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
            <path d="M36,24 Q39,36 40,46" stroke="#eeeeee" stroke-width="8" stroke-linecap="round" fill="none"/>

            <ellipse cx="40" cy="48" rx="4" ry="3" fill="url(#skinGrad)" transform="rotate(10,40,48)"/>
          </g>

          <!-- ── NECK ── -->
          <rect x="19" y="15" width="8" height="10" rx="3" fill="url(#skinGrad)"/>

          <!-- ── HEAD ── -->
          <circle cx="23" cy="12" r="12" fill="url(#skinGrad)" filter="url(#sheikhShadowF)"/>
          <!-- Head highlight -->
          <ellipse cx="19" cy="8" rx="4" ry="3" fill="rgba(255,255,255,.12)" transform="rotate(-10,19,8)"/>

          <!-- ── KUFIYYA / Cap ── -->

          <path d="M18,19 Q22,23 23,23" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"/>

          <!-- ── EYES ── -->
          <circle cx="19" cy="11" r="1.8" fill="#1a0a04"/>

          <path d="M19,17 Q23,15.5 27,17" fill="none" stroke="#3a2a1a" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="sheikh-shadow"></div>

    <!-- ════ MOSQUE SVG ════ -->
    <svg viewBox="0 0 480 320" width="100%" xmlns="http://www.w3.org/2000/svg">

      <rect x="70" y="78" width="28" height="7" fill="#a07848" rx="2"/>

      <path d="M74,90 Q84,82 94,90 L94,114 L74,114 Z" fill="rgba(0,0,0,.1)"/>

      <path d="M72,80 Q84,58 96,80 Z" fill="#d4ba88"/>
      <ellipse cx="84" cy="80" rx="12" ry="4" fill="#c8a870"/>
      <!-- Crescent & star -->
      <g transform="translate(80,46)" filter="url(#neonGlow)">
        <path d="M4,0 A8,8 0 1,1 4,16 A5,5 0 1,0 4,0 Z" fill="#ffd060" opacity=".95"/>
        <polygon points="12,2 13.8,7.5 19.5,7.5 15,11 16.7,16.5 12,13 7.3,16.5 9,11 4.5,7.5 10.2,7.5" fill="#ffd060" transform="scale(.52) translate(4,-2)" opacity=".9"/>
        <!-- Animated shimmer on crescent -->
        <path d="M4,0 A8,8 0 1,1 4,16 A5,5 0 1,0 4,0 Z" fill="none" stroke="#fff8c0" stroke-width=".5" opacity=".6">

      </g>

      <!-- ── RIGHT MINARET ── -->
      <rect x="378" y="105" width="36" height="125" fill="url(#stoneGrad)" filter="url(#brickShadow)"/>
      <g stroke="rgba(0,0,0,.12)" stroke-width="1">
        <line x1="378" y1="122" x2="414" y2="122"/>

        <line x1="378" y1="156" x2="414" y2="156"/>
        <line x1="378" y1="173" x2="414" y2="173"/>
        <line x1="378" y1="190" x2="414" y2="190"/>
        <line x1="378" y1="207" x2="414" y2="207"/>
        <line x1="387" y1="105" x2="387" y2="230" stroke-width=".7"/>
        <line x1="396" y1="105" x2="396" y2="230" stroke-width=".7"/>
        <line x1="405" y1="105" x2="405" y2="230" stroke-width=".7"/>
      </g>
      <rect x="372" y="112" width="48" height="11" fill="#b89060" rx="2"/>
      <path d="M372,112 Q396,108 420,112" fill="none" stroke="#a07848" stroke-width="1.5"/>
      <rect x="384" y="80" width="24" height="34" fill="#caa882" rx="1"/>
      <rect x="382" y="78" width="28" height="7" fill="#a07848" rx="2"/>
      <path d="M386,90 Q396,82 406,90 L406,114 L386,114 Z" fill="rgba(0,0,0,.1)"/>
      <path d="M384,80 Q396,58 408,80 Z" fill="#d4ba88"/>

<script>
'use strict';

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ─── SPLASH ───────────────────────────────────
(function initSplash() {
  const layer = document.getElementById('starsLayer');

  // Regular stars
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.8 + .5;
    s.style.cssText = `
      width:${size}px;height:${size}px;
      top:${Math.random() * 78}%;
      left:${Math.random() * 100}%;
      --dur:${1.4 + Math.random() * 2.8}s;
      --delay:${Math.random() * 4}s;
      opacity:${.3 + Math.random() * .7};
    `;
    layer.appendChild(s);
  }

  // Shooting stars
  for (let i = 0; i < 4; i++) {
    const sh = document.createElement('div');
    sh.className = 'shoot';
    sh.style.cssText = `
      top:${5 + Math.random() * 40}%;
      left:${20 + Math.random() * 60}%;
      --sd:${4 + Math.random() * 4}s;
      --ss:${i * 2.5 + Math.random() * 2}s;
    `;
    layer.appendChild(sh);
  }

  const skipSplash = location.search.includes('skip') || location.hash === '#app';
  const delay = skipSplash ? 80 : 6200;

// ─── PARTICLES ────────────────────────────────
(function initParticles() {
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  // Quran-themed particles: neon green & gold
  for (let i = 0; i < 40; i++) {
    const isGold = Math.random() > .55;
    particles.push({
      x: Math.random() * 1200, y: Math.random() * 1200,
      r: Math.random() * 1.6 + .2,
      dx: (Math.random() - .5) * .25, dy: (Math.random() - .5) * .25,
      alpha: Math.random() * .45 + .08,
      color: isGold ? '#ffd060' : '#00ff99',
    });
  }

  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (document.documentElement.getAttribute('data-theme') === 'light') { requestAnimationFrame(draw); return; }
    frame++;
    particles.forEach((p, i) => {
      p.x += p.dx; p.y += p.dy;
      if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
      // Slow alpha pulse
      const pulse = Math.sin(frame * .02 + i * .4) * .12;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.alpha + pulse);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();

// ─── STATE ────────────────────────────────────
let currentPage = 1;
let currentTab  = 'quran';
let fontIdx     = 1;
const fontSizes = ['fs-sm','fs-md','fs-lg'];
let pageCache   = {};

let isPlaying   = false;

// ─── HELPERS ──────────────────────────────────
function toEA(n) { return String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }
function showLoader() { document.getElementById('loader').classList.add('show'); }
function hideLoader() { document.getElementById('loader').classList.remove('show'); }
function updateNav() {
  document.getElementById('btnPrev').disabled = currentPage <= 1;
  document.getElementById('btnNext').disabled = currentPage >= 604;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── API ──────────────────────────────────────
const API = 'https://api.alquran.cloud/v1';

async function fetchPageData(pageNum, edition) {
  const key = `${pageNum}-${edition}`;
  if (pageCache[key]) return pageCache[key];
  const r = await fetch(`${API}/page/${pageNum}/${edition}`);
  const j = await r.json();
  if (j.code !== 200) throw new Error(j.status);
  pageCache[key] = j.data;
  return j.data;
}

// ─── LOAD PAGE ────────────────────────────────
async function loadPage(num) {
  currentPage = Math.max(1, Math.min(604, num));
  stopAudio();
  showLoader();
  try {
    const edition = currentTab === 'quran' ? 'quran-uthmani' : 'ar.muyassar';
    const data = await fetchPageData(currentPage, edition);
    pageAyahs  = data.ayahs;
    overviewData = data;
    renderPage(data);
  } catch(e) {
    document.getElementById('verseContainer').innerHTML =
      `<div class="msg-box">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" style="margin:0 auto 12px;display:block;opacity:.3">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="16" r="1" fill="currentColor"/>
        </svg>
        حدث خطأ أثناء تحميل البيانات.<br>تأكد من اتصالك بالإنترنت وحاول مجدداً.
      </div>`;
  }
  hideLoader();
  updateNav();
  document.querySelector('.page-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  // إذا كان هناك طلب تلاوة معلق (اختيار سورة من القائمة)، ننفذه فور اكتمال التحميل
  if (recitePending != null) {
    const pn = recitePending;
    recitePending = null;
    // نبدأ داخل معالج تفاعل حقيقي عبر dispatchEvent نقرة على زر الاستماع لضمان قبول المتصفح
    requestAnimationFrame(() => {
      if (pageAyahs.length && pageAyahs.some(a => a.surah.number === pn) && isFullReciter()) {
        document.getElementById('audioBtn').click();
      } else {
        recitePending = pn;
      }
    });
  }
}

// ─── RENDER ───────────────────────────────────
function renderPage(data) {
  const ayahs = data.ayahs;
  if (!ayahs.length) return;

  const first = ayahs[0];
  document.getElementById('pageNumLabel').textContent  = `صفحة ${toEA(currentPage)}`;
  document.getElementById('pageSurahLabel').textContent =
    first.surah.name.replace(/سُورَةُ\s*/, 'سورة ');

  const container = document.getElementById('verseContainer');
  let html = '';
  let prevSurah = null;
  let versBuf   = '';

  function flushBuf() {
    if (versBuf) {
      html += `<div class="verse-section"><div class="verse-paragraph">${versBuf}</div></div>`;
      versBuf = '';
    }
  }

  ayahs.forEach(ay => {
    const sn = ay.surah.number;
    if (sn !== prevSurah) {
      flushBuf();
      if (prevSurah !== null) html += '<hr class="surah-separator"/>';
      prevSurah = sn;
      if (ay.numberInSurah === 1) {
        const isMeccan = ay.surah.revelationType === 'Meccan';
        html += `<div class="surah-box">
          <span class="surah-box-name">${ay.surah.name}</span>
          <div class="surah-box-info">
            <span class="surah-box-num">السورة ${toEA(sn)}</span>
            <span class="surah-box-loc">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none">
                <path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              ${isMeccan ? 'مكية' : 'مدنية'}
            </span>
          </div>
        </div>`;
        if (sn !== 9) html += `<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>`;
      }
    }

    if (currentTab === 'quran') {
      versBuf += `${ay.text}<span class="ayah-num" data-num="${ay.number}">${toEA(ay.numberInSurah)}</span> `;
    } else {
      html += `<div class="verse-section tafsir-text">
        <div class="tafsir-ayah">
          <div class="tafsir-num">الآية ${toEA(ay.numberInSurah)}</div>
          <div>${ay.text}</div>
        </div>
      </div>`;
    }
  });

  if (currentTab === 'quran') flushBuf();
  container.innerHTML = html;
}

// ─── SEARCH ───────────────────────────────────
// تتبع السورة التي يبحث عنها المستخدم حاليًا (يُحدّث عند البحث أو اختيار سورة)
let currentSurahNum = 1;
window.currentSurahNum = 1;

function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  const num = parseInt(q.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
  if (!isNaN(num) && num >= 1 && num <= 604) { loadPage(num); return; }
  const clean = q.replace(/^سورة\s*/, '').trim();
  for (let i = 1; i < SURAHS.length; i++) {
    if (SURAHS[i].n.includes(clean) || clean.includes(SURAHS[i].n)) {
      currentSurahNum = i;
      loadPage(SURAHS[i].p);
      return;
    }
  }
  if (!isNaN(num) && num >= 1 && num <= 114) {
    currentSurahNum = num;
    loadPage(SURAHS[num].p);
    return;
  }
  showToast('لم يُعثر على نتيجة');
}

function goSurah(name) {
  for (let i = 1; i < SURAHS.length; i++) {
    if (SURAHS[i].n === name) {
      currentSurahNum = i;
      loadPage(SURAHS[i].p);
      return;
    }
  }
}

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
// ─── SURAH LIST MODAL ──────
function buildSurahGrid() {
  const grid = document.getElementById('surahGrid');
  if (!grid) return;
  grid.innerHTML = '';
  for (let i = 1; i < SURAHS.length; i++) {
    const s = SURAHS[i];
    const div = document.createElement('div');
    div.className = 'surah-item';
    div.dataset.name = s.n;
    div.dataset.num = String(i);
    div.onclick = () => { closeSurahList(); goSurah(s.n); startRecitationIfFullReciter(i); };
    const isPartial = isPartialSurah(i);
    div.innerHTML = `<span class="surah-item-num">${toEA(i)}</span>
      <span class="surah-item-name">سورة ${s.n}</span>
      <span class="surah-item-meta">${s.t === 'Meccan' ? 'مكية' : 'مدنية'} · ${toEA(s.v)} آية${isPartial ? ' · <b style="color:var(--gold)">ما تيسر</b>' : ''}</span>`;
    grid.appendChild(div);
  }
}
function openSurahList() {
  const modal = document.getElementById('surahModal');
  modal.style.display = 'flex';
  const input = document.getElementById('surahSearchInput');
  input.value = '';
  buildSurahGrid();
  setTimeout(() => input.focus(), 120);
}
function closeSurahList() {
  document.getElementById('surahModal').style.display = 'none';
}
// بدء التلاوة تلقائيًا عند اختيار سورة إذا كان القارئ المختار يقرأ السورة كاملة (نعينع / السيد سعيد)
let recitePending = null;
function startRecitationIfFullReciter(surahNum) {
  if (!isFullReciter()) return;
  if (!isSurahAvailable(surahNum)) {
    const names = selectedReciter.limited.map(n => (SURAHS[n] && SURAHS[n].n) ? SURAHS[n].n : n).join('، ');
    showToast(`✗ سورة ${SURAHS[surahNum].n} غير متوفرة بصوت الشيخ ${selectedReciter.ar} — السور المتاحة: ${names}`);
    return;
  }
  // الصفحة ما تزال تُحمَّل (من اختيار السورة) — نؤجل بدء التلاوة حتى اكتمال التحميل
  // لكن يجب التنفيذ داخل سلسلة تفاعل المستخدم، لذا نستخدم setTimeout قصير يعتمد على
  // أن المتصفح يوافق على التشغيل لأن النقرة الأصلية كانت قبل لحظات على نفس التبويب
  if (!pageAyahs.length || !pageAyahs.some(a => a.surah.number === surahNum)) {
    recitePending = surahNum;
    return;
  }
  // نبدأ التشغيل فورًا داخل سلسلة تفاعل المستخدم (النقر على السورة)
  // لأن المتصفح يرفض التشغيل التلقائي بعد أي setTimeout/await
  const firstIdx = pageAyahs.findIndex(a => a.surah.number === surahNum);
  audioIdx = firstIdx >= 0 ? firstIdx : 0;
  const sn = String(surahNum).padStart(3,'0'); const url = selectedReciter.urls ? (selectedReciter.urls[sn+'-001'] || selectedReciter.urls[sn]) : `${selectedReciter.full}/${sn}${isPartialSurah(surahNum) ? '-001' : ''}.mp3`;
  if (isPlaying) stopAudio();
  if (audio) { audio.onended = null; audio.onerror = null; audio.pause(); audio = null; }
  audio = new Audio(url);
  const session = ++audioSession;
  audio.onended = () => {
    if (session !== audioSession) return;
    // إذا بقيت آيات لسورة أخرى في نفس الصفحة، ننتقل لها
    if (audioIdx + 1 < pageAyahs.length && pageAyahs[audioIdx + 1].surah.number !== surahNum) {
      audioIdx++;
      playNext();
      return;
    }
    stopAudio();
    showToast(`✓ اكتملت التلاوة`);
  };
  audio.onerror = () => {
    if (session !== audioSession) return;
    if (audioIdx + 1 < pageAyahs.length && pageAyahs[audioIdx + 1].surah.number !== surahNum) {
      audioIdx++;
      playNext();
      return;
    }
    stopAudio();
    showToast(`✗ تعذر تحميل التلاوة`);
  };
  isPlaying = true;
  audio.play().then(() => {
    showToast(`✓ بدأت التلاوة بصوت الشيخ ${selectedReciter.ar}`);
    highlightAyah(firstAyahOfSurah(surahNum));
    updateAudioBtn();
  }).catch(() => { stopAudio(); showToast(`✗ تعذر تشغيل التلاوة`); });
}
function filterSurahList() {
  const q = document.getElementById('surahSearchInput').value.trim();
  document.querySelectorAll('.surah-item').forEach(el => {
    if (!q) { el.classList.remove('hidden'); return; }
    const num = parseInt(q.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
    const byName = el.dataset.name.includes(q) || q.includes(el.dataset.name);
    const byNum = !isNaN(num) && String(num) === el.dataset.num;
    el.classList.toggle('hidden', !(byName || byNum));
  });
}
document.getElementById('surahModal').addEventListener('click', e => { if (e.target === document.getElementById('surahModal')) closeSurahList(); });

// ─── AUDIO  (bug-fixed with session IDs) ──────
function getAudioUrl(ayahNum) {
  // قارئ بنمط سورة كاملة (مثل أحمد نعينع من mp3quran أو السيد سعيد)
  if (selectedReciter.full && pageAyahs.length) {
    // نستخدم سورة الآية المطلوبة نفسها (وليس أول سورة في الصفحة)
    // لأن السورة قد تبدأ في منتصف الصفحة (مثل يس في صفحة 440)
    const ay = pageAyahs.find(a => a.number === ayahNum);
    const sn = ay ? ay.surah.number : pageAyahs[0].surah.number;
    // السور الجزئية (ما تيسر) تُخزَّن بصيغة NNN-001.mp3، NNN-002.mp3 ... إلخ
    if (selectedReciter.urls) {
      const s = String(sn).padStart(3,'0');
      return selectedReciter.urls[s+'-001'] || selectedReciter.urls[s] || `${selectedReciter.full}/${s}.mp3`;
    }
    if (selectedReciter.partial && selectedReciter.partial.includes(sn)) {
      return `${selectedReciter.full}/${String(sn).padStart(3,'0')}-001.mp3`;
    }
    return `${selectedReciter.full}/${String(sn).padStart(3,'0')}.mp3`;
  }
  return `https://cdn.islamic.network/quran/audio/128/${selectedReciter.id}/${ayahNum}.mp3`;
}

// هل القارئ الحالي بصيغة سورة كاملة؟
function isFullReciter() {
  return Boolean(selectedReciter.full);
}

// هل السورة الحالية متوفرة لصوت القارئ؟ (للقراء ذوي التلاوات المحدودة مثل السيد سعيد)
// ملاحظة: الصفحة قد تبدأ بسورة أخرى وتنتهي بالسورة المطلوبة (مثل صفحة 235 تبدأ بهود وتنتهي بيوسف)
// لذلك نتحقق من السورة المطلوبة فعليًا وليس أول سورة في الصفحة
let surahAvailabilityTarget = null;
function isSurahAvailable(targetNum) {
  if (!isFullReciter()) return true;
  const limited = selectedReciter.limited;
  if (!limited) return true;
  const num = (targetNum != null) ? targetNum : pageAyahs[0].surah.number;
  return limited.includes(num);
}

// هل السورة من تلاوة "ما تيسر" (جزئية)؟
function isPartialSurah(targetNum) {
  return Boolean(selectedReciter.partial && selectedReciter.partial.includes(targetNum));
}

// الحصول على رقم أول آية في صفحة مختلفة (لسورة كاملة)
function firstAyahOfSurah(surahNum) {
  const ay = pageAyahs.find(a => a.surah.number === surahNum);
  return ay ? ay.number : 1;
}

function highlightAyah(ayahNum) {
  // Remove previous highlight
  document.querySelectorAll('.ayah-num.playing-ayah').forEach(el => el.classList.remove('playing-ayah'));
  if (ayahNum == null) return;
  const el = document.querySelector(`.ayah-num[data-num="${ayahNum}"]`);
  if (el) {
    el.classList.add('playing-ayah');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function playNext() {
  if (!isPlaying || audioIdx >= pageAyahs.length) { stopAudio(); return; }

  // Capture session so stale closures self-invalidate
  const session = ++audioSession;
  const ay = pageAyahs[audioIdx];

  // قارئ كامل السورة: ملف واحد لكل صفحة (ننتقل صفحة جديدة = ملف جديد)
    if (isFullReciter()) {
    const surahNum = ay.surah.number;
    const url = getAudioUrl(ay.number);
    // نظّف الصوت السابق
    if (audio) { audio.onended = null; audio.onerror = null; audio.pause(); audio = null; }
    audio = new Audio(url);
    audio.onended = () => {
      if (session !== audioSession) return;
      // إذا بقيت آيات لسورة أخرى في نفس الصفحة (مثل انتقال من فاطر إلى يس)، ننتقل لها
      if (audioIdx + 1 < pageAyahs.length && pageAyahs[audioIdx + 1].surah.number !== surahNum) {
        audioIdx++;
        playNext();
        return;
      }
      stopAudio();
      showToast(`✓ اكتملت التلاوة`);
    };
    audio.onerror = () => {
      if (session !== audioSession) return;
      if (audioIdx + 1 < pageAyahs.length && pageAyahs[audioIdx + 1].surah.number !== surahNum) {
        audioIdx++;
        playNext();
        return;
      }
      stopAudio();
      showToast(`✗ تعذر تحميل التلاوة`);
    };
    audio.play().catch(() => {
      if (session !== audioSession) return;
      stopAudio();
      showToast(`✗ تعذر تشغيل التلاوة`);
    });
    highlightAyah(firstAyahOfSurah(surahNum));
    updateAudioBtn();
    return;
  }

  // قارئ آية بآية (الافتراضي)
  // Clean up previous audio
  if (audio) { audio.onended = null; audio.onerror = null; audio.pause(); audio = null; }

  audio = new Audio(getAudioUrl(ay.number));
  audio.onended = () => {
    if (session !== audioSession) return;
    audioIdx++;
    playNext();
  };
  audio.onerror = () => {
    if (session !== audioSession) return;
    audioIdx++;
    playNext();
  };
  audio.play().catch(() => {
    if (session !== audioSession) return;
    audioIdx++;
    playNext();
  });

  highlightAyah(ay.number);
  updateAudioBtn();
}

function toggleAudio() {
  if (isPlaying) { stopAudio(); return; }
  if (!pageAyahs.length) return;
  // نستخدم السورة التي يبحث عنها المستخدم (من مربع البحث أو اختيار سورة من القائمة) وليس أول سورة في الصفحة
  let surahNum = currentSurahNum;
  // fallback: إذا كانت الصفحة تعرض سورة واحدة فقط، نستخدمها مباشرة
  if (isFullReciter() && pageAyahs.length) {
    const unique = [...new Set(pageAyahs.map(a => a.surah.number))];
    if (unique.length === 1) surahNum = unique[0];
  }
  if (isFullReciter() && !isSurahAvailable(surahNum)) {
    const names = selectedReciter.limited.map(n => (SURAHS[n] && SURAHS[n].n) ? SURAHS[n].n : n).join('، ');
    showToast(`✗ سورة ${SURAHS[surahNum].n} غير متوفرة بصوت هذا القارئ — السور المتاحة: ${names}`);
    return;
  }
  if (isFullReciter()) {
    // قارئ كامل السورة: نتحقق أولًا من توفر السورة ضمن قائمة القارئ (للقراء ذوي التلاوات المحدودة)
    if (!isSurahAvailable(surahNum)) {
      const names = selectedReciter.limited.map(n => (SURAHS[n] && SURAHS[n].n) ? SURAHS[n].n : n).join('، ');
      showToast(`✗ سورة ${SURAHS[surahNum].n} غير متوفرة بصوت هذا القارئ — السور المتاحة: ${names}`);
      return;
    }
    const sn2 = String(surahNum).padStart(3,'0');
    const headUrl = selectedReciter.urls ? (selectedReciter.urls[sn2+'-001'] || selectedReciter.urls[sn2]) : `${selectedReciter.full}/${sn2}${isPartialSurah(surahNum) ? '-001' : ''}.mp3`;
    fetch(headUrl, { method: 'HEAD' })
      .then(r => {
        if (!r.ok) {
          // إذا فشل التحقق لكن السورة ضمن قائمة القارئ المتاحة، نشغّل الصوت مباشرة (بعض السيرفرات تحظر HEAD)
          if (selectedReciter.limited && selectedReciter.limited.includes(surahNum)) {
            isPlaying = true;
            const idx = pageAyahs.findIndex(a => a.surah.number === surahNum);
            audioIdx = idx >= 0 ? idx : 0;
            playNext();
          } else {
            showToast(`✗ التلاوة غير متوفرة حاليًا`);
          }
          return;
        }
        isPlaying = true;
        const idx = pageAyahs.findIndex(a => a.surah.number === surahNum);
        audioIdx = idx >= 0 ? idx : 0;
        playNext();
      })
      .catch(() => {
        // فشل الشبكة (CORS أو انقطاع): تشغيل مباشرة إذا كانت السورة متوفرة للقارئ
        if (selectedReciter.limited && selectedReciter.limited.includes(surahNum)) {
          isPlaying = true;
          const idx = pageAyahs.findIndex(a => a.surah.number === surahNum);
          audioIdx = idx >= 0 ? idx : 0;
          playNext();
        } else {
          showToast(`✗ تعذر التحقق من التلاوة`);
        }
      });
    return;
  }
  isPlaying = true;
  const idx = pageAyahs.findIndex(a => a.surah.number === surahNum);
  audioIdx  = idx >= 0 ? idx : 0;
  playNext();
}

function stopAudio() {
  isPlaying = false;
  audioSession++;  // invalidate ALL pending callbacks immediately
  if (audio) { audio.onended = null; audio.onerror = null; audio.pause(); audio = null; }
  highlightAyah(null);
  const btn = document.getElementById('audioBtn');
  btn.classList.remove('playing');
  document.getElementById('audioBtnLabel').textContent = 'استماع';
  document.getElementById('audioBtnIcon').innerHTML = `
    <path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2"/>
    <circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="2"/>
  `;
}

function updateAudioBtn() {
  const btn = document.getElementById('audioBtn');
  btn.classList.add('playing');
  const ay = pageAyahs[audioIdx];
  if (isFullReciter()) {
    document.getElementById('audioBtnLabel').textContent = 'إيقاف · كامل السورة';
  } else {
    document.getElementById('audioBtnLabel').textContent = ay ? `إيقاف · ${toEA(ay.numberInSurah)}` : 'إيقاف';
  }
  document.getElementById('audioBtnIcon').innerHTML = `
    <div class="audio-waves">
      ${[0,.15,.3,.15,0].map((d,i)=>`<div class="wave-bar" style="--wd:${d}s"></div>`).join('')}
    </div>
    <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>
    <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>
  `;
}

// ─── OVERVIEW ─────────────────────────────────
function showOverview() {
  if (!overviewData) return;
  const ayahs  = overviewData.ayahs;
  const surahs = [...new Set(ayahs.map(a => a.surah.number))];
  const juz    = [...new Set(ayahs.map(a => a.juz))];
  const surahNames = surahs.map(sn => {
    const ay = ayahs.find(a => a.surah.number === sn);
    return ay ? ay.surah.name : '';
  }).join(' — ');

  document.getElementById('overviewInfo').innerHTML = `
    <div class="ov-row"><span class="ov-label">رقم الصفحة</span><span class="ov-val">${toEA(currentPage)}</span></div>
    <div class="ov-row"><span class="ov-label">السور</span><span class="ov-val">${surahNames}</span></div>
    <div class="ov-row"><span class="ov-label">الجزء</span><span class="ov-val">${juz.map(toEA).join('، ')}</span></div>
    <div class="ov-row"><span class="ov-label">عدد الآيات</span><span class="ov-val">${toEA(ayahs.length)}</span></div>
    <div class="ov-row"><span class="ov-label">القارئ</span><span class="ov-val">${selectedReciter.ar}</span></div>
  `;
  document.getElementById('overview').classList.add('show');
}
function hideOverview() { document.getElementById('overview').classList.remove('show'); }

// ─── BOOT ─────────────────────────────────────
loadPage(1);
</script>
