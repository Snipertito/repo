<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الأذكار والتسبيح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ══════════════════════════════════════════════════
   VARIABLES
══════════════════════════════════════════════════ */
:root {
  --bg:#07070f;--bg2:#0d0d1f;--card:#0f1020;--card2:#131325;
  --border:#1e2040;--text:#d4e0ff;--text-dim:#5a6280;
  --neon:#00ff99;--neon2:#00ccff;--gold:#ffd060;--gold2:#ffaa00;
  --green:#00b36b;--green-dark:#007844;
  --radius:14px;
  --header-bg:rgba(7,7,15,.96);--bar-bg:rgba(7,7,15,.97);
  --bar-border:rgba(30,32,64,.7);--overlay-bg:rgba(0,0,8,.82);
  --modal-bg:#0a0a1a;--verse-color:#e8fff2;
  --neon-glow:drop-shadow(0 0 8px #00ff99) drop-shadow(0 0 16px #00ff99);
  --gold-glow:drop-shadow(0 0 8px #ffd060) drop-shadow(0 0 16px #ffaa00);
}
[data-theme="light"] {
  --bg:#f8f4ec;--bg2:#ede7d8;--card:#fff;--card2:#f5f0e6;
  --border:#ddd0b0;--text:#1a1a10;--text-dim:#7a7060;
  --neon:#007a40;--neon2:#005f80;--gold:#c97a00;--gold2:#a05000;
  --green:#006030;--green-dark:#004020;
  --header-bg:rgba(248,244,236,.97);--bar-bg:rgba(255,255,255,.97);
  --bar-border:rgba(180,160,120,.4);--overlay-bg:rgba(0,0,0,.55);
  --modal-bg:#f8f4ec;--verse-color:#0a1a0a;
  --neon-glow:drop-shadow(0 0 4px #007a40);
  --gold-glow:drop-shadow(0 0 4px #c97a00);
}

/* ══════════════════════════════════════════════════
   RESET
══════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:'Cairo',sans-serif;direction:rtl;overflow-x:hidden;
  transition:background .4s,color .4s}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ══════════════════════════════════════════════════
   SPLASH
══════════════════════════════════════════════════ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(175deg,#02010c 0%,#060420 40%,#0c0726 70%,#110930 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  overflow:hidden;
}
#splash.fade-out{animation:splashOut 1s ease-in forwards}
@keyframes splashOut{to{opacity:0;transform:scale(1.03);pointer-events:none}}

.s-star{position:absolute;border-radius:50%;background:#fff;
  animation:twinkle var(--sd,2s) var(--ss,0s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.12;transform:scale(.6)}100%{opacity:1;transform:scale(1.4)}}

/* Shooting star */
.s-shoot{position:absolute;opacity:0;
  animation:shoot var(--shd,5s) var(--shs,0s) ease-in infinite}
@keyframes shoot{
  0%{opacity:0;transform:translate(0,0) scale(1)}
  5%{opacity:1}
  18%{opacity:0;transform:translate(-140px,70px) scale(0)}
  100%{opacity:0}
}

.s-moon{position:absolute;top:6%;right:8%;width:68px;height:68px;
  opacity:0;animation:moonRise 1.2s .3s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes moonRise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}

.s-bismillah{
  position:absolute;top:9%;left:50%;transform:translateX(-50%);
  font-family:'Amiri Quran',serif;font-size:21px;
  color:var(--gold);text-shadow:0 0 14px #ffd060,0 0 28px #ffaa00,0 0 50px rgba(255,170,0,.4);
  white-space:nowrap;opacity:0;
  animation:textIn 1s .9s ease forwards;text-align:center;
}
.s-title{
  position:absolute;top:calc(9% + 36px);left:50%;transform:translateX(-50%);
  font-size:14px;font-weight:700;color:rgba(180,215,200,.8);
  letter-spacing:3px;white-space:nowrap;text-transform:uppercase;
  opacity:0;animation:textIn 1s 1.4s ease forwards;
}
@keyframes textIn{
  0%{opacity:0;transform:translateX(-50%) translateY(8px)}
  100%{opacity:1;transform:translateX(-50%) translateY(0)}
}

/* Tasbeeh beads decoration */
.s-beads{
  position:absolute;top:calc(9% + 70px);left:50%;transform:translateX(-50%);
  opacity:0;animation:textIn .8s 1.9s ease forwards;
}

/* Scene */
.s-scene{width:100%;max-width:480px;position:relative;
  opacity:0;animation:sceneIn 1.2s 1s ease forwards}
@keyframes sceneIn{to{opacity:1}}

/* Praying person */
.s-person{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);
  z-index:10;opacity:0;animation:personIn 1s 2.2s ease forwards}
@keyframes personIn{to{opacity:1}}

/* Prayer glow on ground */
.s-light{
  position:absolute;bottom:70px;left:50%;transform:translateX(-50%);
  width:220px;height:65px;
  background:radial-gradient(ellipse at 50% 100%,rgba(0,255,153,.28) 0%,rgba(0,200,100,.1) 40%,transparent 70%);
  opacity:0;animation:lightFloat 2.5s 3s ease-in-out infinite;
}
@keyframes lightFloat{
  0%,100%{opacity:.35;transform:translateX(-50%) scaleX(.85)}
  50%{opacity:1;transform:translateX(-50%) scaleX(1)}
}

/* Floating dua particles */
.s-dua-particle{
  position:absolute;border-radius:50%;pointer-events:none;
  animation:duaFloat var(--dpd,2s) var(--dps,3s) ease-out infinite;
  opacity:0;
}
@keyframes duaFloat{
  0%{opacity:.8;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dpx,0px),var(--dpy,-60px)) scale(0)}
}

.s-dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:7px}
.s-dot{width:6px;height:6px;border-radius:50%;background:var(--neon);opacity:.2;
  animation:dotPulse 1.4s var(--dd,0s) ease-in-out infinite alternate}
@keyframes dotPulse{to{opacity:1;transform:scale(1.5)}}

/* ══════════════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════════════ */
#mainApp{max-width:480px;margin:0 auto;padding-bottom:85px;
  opacity:0;transition:opacity .7s}
#mainApp.visible{opacity:1}
#particleCanvas{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35}

/* ── HEADER ── */
.header{
  padding:14px 16px 10px;background:var(--header-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid rgba(255,255,255,.04);transition:background .4s;
}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.header-left{display:flex;align-items:center;gap:10px}
.header-left h1{font-size:18px;font-weight:900;color:#fff;
  text-shadow:0 0 20px rgba(0,255,153,.2);letter-spacing:-.3px}
[data-theme="light"] .header-left h1{color:#0a1a08;text-shadow:none}
.header-sub{font-size:11px;color:var(--neon);font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;text-shadow:0 0 10px var(--neon)}

.live-dot{width:7px;height:7px;border-radius:50%;background:var(--neon);
  box-shadow:0 0 8px var(--neon);display:inline-block;
  animation:livePulse 2s ease-in-out infinite}
@keyframes livePulse{
  0%,100%{box-shadow:0 0 4px var(--neon);transform:scale(1)}
  50%{box-shadow:0 0 14px var(--neon),0 0 22px rgba(0,255,153,.3);transform:scale(1.2)}
}

.theme-btn{
  background:transparent;border:1.5px solid var(--border);
  border-radius:20px;padding:6px 12px;cursor:pointer;
  display:flex;align-items:center;gap:5px;
  font-size:12px;color:var(--text-dim);transition:all .2s;
  user-select:none;font-family:'Cairo',sans-serif;
}
.theme-btn:active{transform:scale(.94);border-color:var(--neon)}

/* ── NEON LINE ── */
.neon-line{height:1px;
  background:linear-gradient(90deg,transparent 0%,var(--neon) 30%,var(--gold) 50%,var(--neon) 70%,transparent 100%);
  opacity:.2}

/* ── CATEGORY SECTION TITLE ── */
.cat-section-title{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px 10px;
  font-size:12px;color:var(--text-dim);font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;
}
.cat-section-title::before{
  content:'';width:3px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,var(--neon),var(--gold));
  flex-shrink:0;
}
.cat-section-title::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,var(--border),transparent);
}

/* ── CATEGORY GRID ── */
#categoryView{padding:0;position:relative;z-index:1}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 12px}
.cat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 14px;
  cursor:pointer;transition:all .22s;
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;
  position:relative;overflow:hidden;
}
.cat-card::before{
  content:'';position:absolute;inset:0;opacity:0;
  background:radial-gradient(ellipse at 30% 30%,rgba(0,255,153,.1),transparent 65%);
  transition:opacity .25s;
}
.cat-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--card-accent,var(--neon)),transparent);
  opacity:0;transition:opacity .25s;
}
.cat-card:active{transform:scale(.96)}
.cat-card:active::before{opacity:1}
.cat-card:active::after{opacity:1}

.cat-card.featured{
  grid-column:span 2;flex-direction:row;align-items:center;
  gap:14px;padding:16px;
  border-color:rgba(255,208,96,.3);
  background:linear-gradient(135deg,var(--card) 0%,rgba(255,208,96,.04) 100%);
}
.cat-card.featured::after{
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.5;
}
.cat-card.featured .cat-name{font-size:15px}

.cat-icon{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:transform .2s;
}
.cat-card:active .cat-icon{transform:scale(.92)}
.cat-name{font-size:13px;font-weight:800;color:var(--text);line-height:1.3}
.cat-sub{font-size:11px;color:var(--text-dim);margin-top:2px;font-weight:500}

/* ── AZKAR VIEW ── */
#azkarView{display:none;position:relative;z-index:1}
.section-header{
  padding:12px 16px 10px;background:var(--header-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid rgba(255,255,255,.04);
  display:flex;align-items:center;gap:10px;
}
.back-btn{
  background:var(--card2);border:1.5px solid var(--border);
  border-radius:10px;padding:7px 13px;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  font-size:13px;color:var(--text);transition:all .15s;
  font-family:'Cairo',sans-serif;font-weight:700;
}
.back-btn:active{background:var(--border);transform:scale(.96)}
.section-cat-title{
  font-size:15px;font-weight:900;color:var(--neon);
  text-shadow:0 0 10px var(--neon);flex:1;
}

/* Progress bar */
.azkar-progress{
  margin:12px 12px 0;padding:12px 16px;
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;display:flex;align-items:center;gap:12px;
}
.progress-label{font-size:11px;color:var(--text-dim);font-weight:700;letter-spacing:.5px}
.progress-bar-wrap{
  flex:1;height:6px;background:var(--card2);
  border-radius:3px;overflow:hidden;
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--neon),var(--gold));
  border-radius:3px;transition:width .4s cubic-bezier(.2,.8,.4,1);width:0%;
}
.progress-val{
  font-size:14px;font-weight:900;color:var(--neon);
  min-width:36px;text-align:left;
  text-shadow:0 0 8px var(--neon);
}

/* Azkar cards */
.azkar-list{padding:10px 12px 0;display:flex;flex-direction:column;gap:10px}
.zikr-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  transition:border-color .25s,box-shadow .25s,transform .15s;
  position:relative;
}
.zikr-card.completed{
  border-color:rgba(0,255,153,.4);
  box-shadow:0 0 20px rgba(0,255,153,.08);
}
.zikr-card.completed::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(0,255,153,.04) 0%,transparent 60%);
}
/* Completed checkmark badge */
.done-badge{
  position:absolute;top:10px;left:10px;
  width:24px;height:24px;border-radius:50%;
  background:var(--neon);display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.5);transition:all .3s cubic-bezier(.2,.8,.4,1);
  z-index:2;
}
.zikr-card.completed .done-badge{opacity:1;transform:scale(1)}

.zikr-top{padding:14px 14px 10px}
.zikr-source{
  font-size:11px;color:var(--gold);font-weight:700;
  margin-bottom:8px;display:flex;align-items:center;gap:6px;
  text-transform:uppercase;letter-spacing:.5px;
}
.zikr-text{
  font-family:'Amiri Quran',serif;font-size:20px;
  line-height:2.5;color:var(--verse-color);
  direction:rtl;text-align:right;
}
.zikr-translation{
  font-size:12px;color:var(--text-dim);line-height:1.8;
  margin-top:10px;padding-top:10px;
  border-top:1px solid var(--border);
}

.zikr-bottom{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;background:var(--card2);
  border-top:1px solid var(--border);
}
.zikr-repeat-info{font-size:11px;color:var(--text-dim);font-weight:600}
.zikr-counter{display:flex;align-items:center;gap:12px}

/* Counter ring */
.counter-ring{
  position:relative;width:54px;height:54px;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  transition:transform .12s;
}
.counter-ring:active{transform:scale(.9)}
.counter-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:4}
.ring-fill{
  fill:none;stroke:var(--neon);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:138;stroke-dashoffset:138;
  transition:stroke-dashoffset .35s cubic-bezier(.2,.8,.4,1);
}
.gold-ring .ring-fill{stroke:var(--gold)}
.counter-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:var(--text);
}
.zikr-remain{
  font-size:24px;font-weight:900;color:var(--text);
  min-width:32px;text-align:center;transition:transform .12s,color .12s;
}
.zikr-remain.bounce{animation:numBounce .22s ease}
@keyframes numBounce{
  0%{transform:scale(1.35);color:var(--neon)}
  100%{transform:scale(1);color:var(--text)}
}

/* ── TASBEEH ── */
#tasbeehView{display:none;padding:12px 12px 0;position:relative;z-index:1}
.tasbeeh-section-header{
  padding:12px 16px 10px;background:var(--header-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid rgba(255,255,255,.04);
  display:flex;align-items:center;gap:10px;
}
.tasbeeh-wrap{
  display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:18px 0 10px;
}
.tasbeeh-select{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 6px;
}
.tasbeeh-opt{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:20px;padding:7px 16px;
  font-size:13px;font-family:'Cairo',sans-serif;font-weight:700;
  cursor:pointer;transition:all .2s;color:var(--text);
}
.tasbeeh-opt.active{
  background:var(--green-dark);border-color:var(--neon);color:#fff;
  box-shadow:0 0 12px rgba(0,255,153,.25);
}
.tasbeeh-text{
  font-family:'Amiri Quran',serif;font-size:24px;
  color:var(--gold);text-align:center;
  text-shadow:0 0 14px rgba(255,208,96,.5);
  padding:0 24px;line-height:1.9;
  min-height:50px;
}

/* Big tasbeeh button */
.tasbeeh-btn{
  width:188px;height:188px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#1c3428,#0d1a12);
  border:2.5px solid var(--neon);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  transition:transform .1s,box-shadow .1s;
  box-shadow:
    0 0 24px rgba(0,255,153,.2),
    0 0 48px rgba(0,255,153,.06),
    inset 0 0 30px rgba(0,255,153,.05);
  position:relative;overflow:hidden;
}
.tasbeeh-btn::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 28%,rgba(255,255,255,.07),transparent 55%);
  pointer-events:none;
}
/* Outer pulse ring */
.tasbeeh-btn::after{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  border:2px solid rgba(0,255,153,.15);
  animation:ringPulse 2.5s ease-in-out infinite;
}
@keyframes ringPulse{
  0%,100%{transform:scale(1);opacity:.4}
  50%{transform:scale(1.05);opacity:.8}
}
[data-theme="light"] .tasbeeh-btn{
  background:radial-gradient(circle at 40% 35%,#d4f0e4,#b4dccc);
}
.tasbeeh-btn:active{
  transform:scale(.92);
  box-shadow:0 0 36px rgba(0,255,153,.45),inset 0 0 36px rgba(0,255,153,.12);
}
.tasbeeh-count{
  font-size:56px;font-weight:900;color:var(--neon);
  text-shadow:0 0 16px var(--neon),0 0 30px rgba(0,255,153,.4);
  line-height:1;
  transition:transform .08s;
}
.tasbeeh-btn:active .tasbeeh-count{transform:scale(.88)}
.tasbeeh-target{font-size:13px;color:var(--text-dim);margin-top:5px;font-weight:600}

/* Round progress under button */
.tasbeeh-ring-wrap{
  position:relative;width:208px;height:208px;flex-shrink:0;
}
.tasbeeh-ring-svg{
  position:absolute;inset:0;width:100%;height:100%;
  transform:rotate(-90deg);pointer-events:none;
}
.tasbeeh-ring-bg{fill:none;stroke:var(--border);stroke-width:3}
.tasbeeh-ring-fill{
  fill:none;stroke:var(--neon);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:596;stroke-dashoffset:596;
  transition:stroke-dashoffset .4s cubic-bezier(.2,.8,.4,1);
  filter:drop-shadow(0 0 4px var(--neon));
}
.tasbeeh-btn-inner{
  position:absolute;inset:10px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

/* Beads visualizer */
.tasbeeh-beads{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  max-width:300px;padding:0 12px;
}
.bead{
  width:14px;height:14px;border-radius:50%;
  background:var(--border);
  transition:background .2s,box-shadow .2s,transform .12s;
}
.bead.lit{
  background:var(--neon);
  box-shadow:0 0 8px var(--neon);
  transform:scale(1.1);
}
.bead.gold-bead{background:var(--gold);box-shadow:0 0 8px var(--gold);transform:scale(1.2)}

.tasbeeh-controls{display:flex;gap:10px;align-items:center;margin-top:4px}
.t-ctrl{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:12px;padding:10px 22px;cursor:pointer;
  font-size:13px;font-family:'Cairo',sans-serif;font-weight:700;
  color:var(--text);transition:all .15s;
}
.t-ctrl:active{background:var(--card2);transform:scale(.95)}
.t-ctrl.reset{border-color:rgba(255,70,70,.35);color:#ff6060}
.t-ctrl.reset:active{background:rgba(255,70,70,.08)}

/* ── BOTTOM BAR ── */
.bottom-bar{
  position:fixed;bottom:0;right:0;left:0;max-width:480px;margin:0 auto;
  background:var(--bar-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--bar-border);
  display:flex;z-index:100;transition:background .4s;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.bar-btn{
  flex:1;padding:12px 0 9px;text-align:center;
  font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;
  color:var(--text-dim);cursor:pointer;border:none;background:none;
  transition:color .2s;display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;
}
.bar-btn::after{
  content:'';position:absolute;bottom:0;left:30%;right:30%;height:2px;
  background:var(--neon);border-radius:2px 2px 0 0;
  transform:scaleX(0);transition:transform .3s ease;
}
.bar-btn.active-bar::after{transform:scaleX(1)}
.bar-btn.active-bar{color:var(--neon)}
.bar-btn.active-bar svg{filter:var(--neon-glow)}
.bar-btn:active svg{transform:scale(.86)}
.bar-divider{width:1px;background:var(--bar-border);margin:10px 0}

/* ── LOADER ── */
#loader{
  position:fixed;inset:0;background:rgba(7,7,15,.75);
  display:flex;align-items:center;justify-content:center;
  z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;
  backdrop-filter:blur(4px);
}
#loader.show{opacity:1;pointer-events:all}
.spinner{
  width:48px;height:48px;border:3px solid var(--border);
  border-top-color:var(--neon);border-right-color:var(--gold);
  border-radius:50%;animation:spin .75s linear infinite;
  filter:drop-shadow(0 0 8px var(--neon));
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── CELEBRATION ── */
.celebration{
  position:fixed;inset:0;z-index:9000;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.celeb-text{
  font-family:'Amiri Quran',serif;font-size:30px;color:var(--gold);
  text-shadow:0 0 24px var(--gold),0 0 48px var(--gold2);
  opacity:0;transform:scale(.4);text-align:center;
  padding:24px 32px;border-radius:20px;
  background:rgba(7,7,15,.9);border:2px solid rgba(255,208,96,.3);
  backdrop-filter:blur(20px);
}
.celeb-text.show{animation:celebPop 3s ease forwards}
@keyframes celebPop{
  0%{opacity:0;transform:scale(.4)}
  15%{opacity:1;transform:scale(1.05)}
  25%{transform:scale(1)}
  75%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(.9)}
}

/* Confetti pieces */
.confetti-piece{
  position:fixed;pointer-events:none;z-index:8999;
  width:8px;height:8px;border-radius:2px;
  animation:confettiFall var(--cd,2s) var(--cds,0s) ease-in forwards;
  opacity:0;
}
@keyframes confettiFall{
  0%{opacity:1;transform:translate(0,0) rotate(0deg)}
  100%{opacity:0;transform:translate(var(--cx,20px),var(--cy,200px)) rotate(var(--cr,360deg))}
}

/* Toast */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--card2);border:1.5px solid var(--neon);
  color:var(--text);padding:10px 22px;border-radius:20px;
  font-size:13px;font-weight:700;z-index:9000;
  opacity:0;transition:all .3s cubic-bezier(.2,.8,.4,1);
  box-shadow:0 8px 30px rgba(0,255,153,.2);white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

(function(){
  const layer = document.getElementById('starsLayer');
  for(let i=0;i<85;i++){
    const s=document.createElement('div');s.className='s-star';
    const sz=Math.random()*2.6+.4;
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*78}%;left:${Math.random()*100}%;--sd:${1.4+Math.random()*2.6}s;--ss:${Math.random()*4}s;opacity:${.3+Math.random()*.7}`;
    layer.appendChild(s);
  }
  // Shooting stars
  for(let i=0;i<3;i++){
    const sh=document.createElement('div');sh.className='s-shoot';
    sh.style.cssText=`width:2px;height:2px;border-radius:50%;background:#fff;top:${5+Math.random()*35}%;left:${20+Math.random()*55}%;--shd:${5+Math.random()*4}s;--shs:${i*3+Math.random()*2}s`;
    layer.appendChild(sh);
  }
  const skip=location.search.includes('skip')||location.hash==='#app';
  setTimeout(()=>{
    const sp=document.getElementById('splash');
    const ap=document.getElementById('mainApp');
    if(skip)sp.style.display='none';else sp.classList.add('fade-out');
    ap.classList.add('visible');
    setTimeout(()=>{sp.style.display='none'},1000);
  },skip?50:5800);
})();

// ─── PARTICLES ────────────────────────────────
(function(){
  const c=document.getElementById('particleCanvas'),ctx=c.getContext('2d');
  let W,H,pts=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  window.addEventListener('resize',resize);resize();
  for(let i=0;i<38;i++){
    const isGold=Math.random()>.55;
    pts.push({x:Math.random()*1200,y:Math.random()*1200,r:Math.random()*1.5+.2,
      dx:(Math.random()-.5)*.22,dy:(Math.random()-.5)*.22,
      a:Math.random()*.42+.06,col:isGold?'#ffd060':'#00ff99'});
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    if(document.documentElement.getAttribute('data-theme')==='light'){requestAnimationFrame(draw);return}
    frame++;
    pts.forEach((p,i)=>{
      p.x+=p.dx;p.y+=p.dy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      const pulse=Math.sin(frame*.018+i*.5)*.1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.col;ctx.globalAlpha=Math.max(0,p.a+pulse);ctx.fill();
    });
    ctx.globalAlpha=1;requestAnimationFrame(draw);
  }
  draw();
})();

}

    {text:'رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً',trans:'دعاء ثبات القلب',source:'القرآن',repeat:1},
    {text:'حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',trans:'حسبي الله',source:'أبو داود',repeat:7},
    {text:'اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا، وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا، أَنْتَ وَلِيُّهَا وَمَوْلَاهَا',trans:'دعاء تزكية النفس',source:'مسلم',repeat:1},
  ],
};

// ─── STATE ────────────────────────────────────
let currentCatId=null;
let counters={};
let currentView='azkar';

// ─── CATEGORY GRID ────────────────────────────
function buildCategoryGrid(){
  const grid=document.getElementById('catGrid');
  grid.innerHTML=CATEGORIES.map((c,i)=>`
    <div class="cat-card${c.featured?' featured':''}" onclick="openCategory('${c.id}')" style="--card-accent:${c.accent}">
      <div class="cat-icon" style="background:${c.bg}">${c.svg}</div>
      <div>
        <div class="cat-name">${c.name}</div>
        <div class="cat-sub">${c.sub}</div>
      </div>
    </div>
  `).join('');
}

// ─── OPEN CATEGORY ────────────────────────────
function openCategory(catId){
  currentCatId=catId;counters={};
  const cat=CATEGORIES.find(c=>c.id===catId);
  const list=AZKAR[catId]||[];
  document.getElementById('azkarCatTitle').textContent=cat?cat.name:'';
  document.getElementById('categoryView').style.display='none';
  const av=document.getElementById('azkarView');
  av.style.display='block';
  buildAzkarList(list);
  updateProgress();
  window.scrollTo(0,0);
}

function showCategories(){
  document.getElementById('categoryView').style.display='block';
  document.getElementById('azkarView').style.display='none';
  document.getElementById('tasbeehView').style.display='none';
  document.getElementById('barAzkar').classList.add('active-bar');
  document.getElementById('barTasbeeh').classList.remove('active-bar');
  window.scrollTo(0,0);
}

// ─── BUILD AZKAR LIST ─────────────────────────
function buildAzkarList(list){
  const container=document.getElementById('azkarList');
  container.innerHTML=list.map((z,i)=>`
    <div class="zikr-card" id="zikr-${i}">
      <div class="done-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
          <path d="M5 13L9 17L19 7" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="zikr-top">
        <div class="zikr-source">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="currentColor" stroke-width="2"/>
          </svg>
          رواه ${z.source}
        </div>
        <div class="zikr-text">${z.text}</div>
        ${z.trans?`<div class="zikr-translation">${z.trans}</div>`:''}
      </div>
      <div class="zikr-bottom">
        <div>
          <div class="zikr-repeat-info">التكرار المطلوب</div>
          <div class="zikr-remain" id="left-${i}">${toAr(z.repeat)} ×</div>
        </div>
        <div class="zikr-counter">
          <div class="counter-ring${z.repeat>33?' gold-ring':''}" onclick="tapCounter(${i},${z.repeat})" id="ring-${i}">
            <svg viewBox="0 0 44 44">
              <circle class="ring-bg" cx="22" cy="22" r="18"/>
              <circle class="ring-fill" cx="22" cy="22" r="18" id="rfill-${i}" style="stroke-dashoffset:138"/>
            </svg>
            <div class="counter-num" id="cnum-${i}">٠</div>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

// ─── TAP COUNTER ──────────────────────────────
function tapCounter(idx,target){
  if(!counters[idx]) counters[idx]=0;
  if(counters[idx]>=target) return;
  counters[idx]++;
  const cur=counters[idx];
  const pct=cur/target;
  const offset=138-(138*pct);

  const fill=document.getElementById(`rfill-${idx}`);
  if(fill) fill.style.strokeDashoffset=offset;

  const numEl=document.getElementById(`cnum-${idx}`);
  if(numEl) numEl.textContent=toAr(cur);

  const leftEl=document.getElementById(`left-${idx}`);
  if(leftEl){
    const rem=target-cur;
    leftEl.textContent=rem>0?`${toAr(rem)} ×`:'✓';
    leftEl.classList.add('bounce');
    setTimeout(()=>leftEl.classList.remove('bounce'),220);
  }

  if(navigator.vibrate) navigator.vibrate(14);

  if(cur>=target){
    const card=document.getElementById(`zikr-${idx}`);
    if(card) card.classList.add('completed');
    setTimeout(()=>updateProgress(),100);
  } else {
    updateProgress();
  }
}

// ─── PROGRESS ─────────────────────────────────
function updateProgress(){
  const list=AZKAR[currentCatId]||[];
  const total=list.length;
  let done=0;
  list.forEach((_,i)=>{ if(counters[i]>=(list[i].repeat)) done++ });
  const pct=total>0?Math.round((done/total)*100):0;
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressVal').textContent=toAr(pct)+'٪';
  if(pct===100) celebrate('أَحْسَنْتَ! اكتملت الأذكار ✦');
}

// ─── CELEBRATION ──────────────────────────────
function celebrate(msg){
  const el=document.getElementById('celebText');
  el.textContent=msg;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  if(navigator.vibrate) navigator.vibrate([50,40,80,40,160,40,80]);
  // Confetti burst
  spawnConfetti();
  setTimeout(()=>el.classList.remove('show'),3000);
}

function spawnConfetti(){
  const colors=['#ffd060','#00ff99','#00ccff','#ff9900','#ffffff'];
  for(let i=0;i<32;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const x=(Math.random()-.5)*300;
    const y=-(150+Math.random()*250);
    const r=(Math.random()-.5)*720;
    p.style.cssText=`
      left:${30+Math.random()*40}vw;top:40vh;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${Math.random()>0.5?'50%':'2px'};
      --cx:${x}px;--cy:${y}px;--cr:${r}deg;
      --cd:${1.5+Math.random()*1.2}s;--cds:${Math.random()*.4}s;
    `;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 2200);
  }
}

// ─── TASBEEH ──────────────────────────────────
const TASBEEH_OPTS=[
  {text:'سُبْحَانَ اللَّهِ',    short:'سبحان الله',target:33},
  {text:'الْحَمْدُ لِلَّهِ',   short:'الحمد لله',  target:33},
  {text:'اللَّهُ أَكْبَرُ',    short:'الله أكبر',  target:34},
  {text:'لَا إِلَهَ إِلَّا اللَّهُ',short:'لا إله إلا الله',target:100},
  {text:'أَسْتَغْفِرُ اللَّهَ',short:'أستغفر الله',target:100},
  {text:'الصَّلَاةُ عَلَى النَّبِيِّ',short:'الصلاة على النبي',target:100},
];
let tasbeehIdx=0;
let tasbeehCount=0;
const BEADS=33;

function buildTasbeeh(){
  const sel=document.getElementById('tasbeehSelect');
  sel.innerHTML=TASBEEH_OPTS.map((o,i)=>`
    <button class="tasbeeh-opt${i===tasbeehIdx?' active':''}" onclick="selectTasbeeh(${i})">${o.short}</button>
  `).join('');
  document.getElementById('tasbeehText').textContent=TASBEEH_OPTS[tasbeehIdx].text;
  document.getElementById('tasbeehTarget').textContent=`من ${toAr(TASBEEH_OPTS[tasbeehIdx].target)}`;
  renderTasbeehBeads();
  updateTasbeehRing();
}

function selectTasbeeh(idx){
  tasbeehIdx=idx;tasbeehCount=0;
  buildTasbeeh();
  document.getElementById('tasbeehCount').textContent=toAr(0);
}

function tapTasbeeh(){
  const opt=TASBEEH_OPTS[tasbeehIdx];
  tasbeehCount++;
  document.getElementById('tasbeehCount').textContent=toAr(tasbeehCount%opt.target||opt.target);
  if(navigator.vibrate) navigator.vibrate(18);
  renderTasbeehBeads();
  updateTasbeehRing();
  if(tasbeehCount%opt.target===0){
    celebrate('سُبْحَانَ اللَّهِ! اكتمل الذكر ✦');
  }
}

function updateTasbeehRing(){
  const opt=TASBEEH_OPTS[tasbeehIdx];
  const ringLen=596;
  const filled=(tasbeehCount%opt.target)/opt.target;
  const offset=ringLen-(ringLen*filled);
  const fillEl=document.getElementById('tasbeehRingFill');
  if(fillEl) fillEl.style.strokeDashoffset=offset;
}

function renderTasbeehBeads(){
  const opt=TASBEEH_OPTS[tasbeehIdx];
  const active=tasbeehCount%opt.target;
  const beadsEl=document.getElementById('tasbeehBeads');
  let html='';
  for(let i=0;i<BEADS;i++){
    const isLit=i<active;
    const isGold=i===Math.floor(BEADS/2);
    html+=`<div class="bead${isLit?' lit':''}${isGold?' gold-bead':''}"></div>`;
  }
  beadsEl.innerHTML=html;
}

function resetTasbeeh(){
  tasbeehCount=0;
  document.getElementById('tasbeehCount').textContent=toAr(0);
  renderTasbeehBeads();
  updateTasbeehRing();
  showToast('✓ تمت الإعادة');
}
function nextTarget(){
  tasbeehIdx=(tasbeehIdx+1)%TASBEEH_OPTS.length;
  tasbeehCount=0;buildTasbeeh();
  document.getElementById('tasbeehCount').textContent=toAr(0);
}
function prevTarget(){
  tasbeehIdx=(tasbeehIdx-1+TASBEEH_OPTS.length)%TASBEEH_OPTS.length;
  tasbeehCount=0;buildTasbeeh();
  document.getElementById('tasbeehCount').textContent=toAr(0);
}

// ─── TAB SWITCHING ────────────────────────────
function switchTab(tab){
  currentView=tab;
  if(tab==='azkar'){
    document.getElementById('categoryView').style.display='block';
    document.getElementById('azkarView').style.display='none';
    document.getElementById('tasbeehView').style.display='none';
    document.getElementById('barAzkar').classList.add('active-bar');
    document.getElementById('barTasbeeh').classList.remove('active-bar');
  }else{
    document.getElementById('categoryView').style.display='none';
    document.getElementById('azkarView').style.display='none';
    document.getElementById('tasbeehView').style.display='block';
    document.getElementById('barTasbeeh').classList.add('active-bar');
    document.getElementById('barAzkar').classList.remove('active-bar');
    buildTasbeeh();
  }
  window.scrollTo(0,0);
}

// ─── BOOT ─────────────────────────────────────
buildCategoryGrid();
</script>
</body>
